- name: Ensure base packages
  apt:
    name:
      - software-properties-common
      - curl
      - ca-certificates
      - unzip
      - git
      - ufw
      - jq
      - acl
      - python3-pip
    state: present
    update_cache: yes
  async: 120
  poll: 5

- name: Install PyMySQL for Ansible MySQL modules (via apt)
  apt:
    name: python3-pymysql
    state: present

- name: Optional 2G swap
  command: bash -lc '[[ -f /swapfile ]] || (fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048 && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "/swapfile none swap sw 0 0" >> /etc/fstab)'
  args:
    creates: /swapfile

- name: Allow OpenSSH
  ufw:
    rule: allow
    name: OpenSSH

- name: UFW basics (enable after allowing SSH)
  ufw:
    state: enabled
    policy: deny

- name: Allow Nginx Full
  ufw:
    rule: allow
    name: 'Nginx Full'
  when: false # moved to nginx role after install

